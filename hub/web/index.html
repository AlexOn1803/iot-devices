<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IoT Хаб</title>
<style>
  :root {
    --bg: #0f1115; --card: #1a1d24; --card2: #222632; --line: #2b303c; --text: #eef0f4; --sub: #9aa1ad;
    --accent: #7aa2ff; --on: #2fbf71; --off: #3a3f4b; --warn: #ff6b6b; --amber: #f2b84b; --radius: 18px;
  }
  @media (prefers-color-scheme: light) {
    :root:not(.kiosk) { --bg: #f3f4f7; --card: #fff; --card2: #eef0f5; --line: #e2e5ec; --text: #15171c; --sub: #5d6470; --off: #cfd3dc; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 18px 6px; flex-wrap: wrap; }
  header h1 { font-size: 22px; margin: 0; flex: 1; font-weight: 600; min-width: 140px; }
  nav.tabs { display: flex; gap: 6px; padding: 4px 16px 10px; overflow-x: auto; }
  nav.tabs button { white-space: nowrap; }
  nav.tabs button.sel { background: var(--accent); color: #0b1020; }
  .pill { font-size: 13px; color: var(--sub); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); margin-right: 6px; }
  .dot.ok { background: var(--on); }
  button { font: inherit; color: inherit; background: var(--card2); border: 0; border-radius: 12px; padding: 9px 14px; cursor: pointer; }
  button.primary { background: var(--accent); color: #0b1020; font-weight: 600; }
  button.danger { color: var(--warn); }
  button.ghost { background: transparent; color: var(--sub); }
  button.small { padding: 5px 10px; font-size: 14px; }
  button:disabled { opacity: .5; cursor: default; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; }
  input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); }
  input[type=range] { accent-color: var(--accent); padding: 0; border: 0; background: transparent; }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--sub); flex: 1; min-width: 120px; }
  label.f > input, label.f > select { font-size: 16px; color: var(--text); }
  label.c { display: flex; gap: 8px; align-items: center; }
  .grid { padding: 4px 16px 32px; display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .kiosk .grid { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
  .page { padding: 4px 16px 40px; max-width: 900px; }
  .card { background: var(--card); border-radius: var(--radius); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
  .grid .card { min-height: 120px; }
  .card.on { outline: 2px solid color-mix(in srgb, var(--on) 55%, transparent); }
  .card.bat { outline: 2px solid #ff5a5a; background: color-mix(in srgb, #ff5a5a 14%, var(--card)); }
  .card.grid { outline: 2px solid #4f8cff; background: color-mix(in srgb, #4f8cff 12%, var(--card)); }
  input[type=color] { width: 44px; height: 34px; padding: 2px; }
  .card h3 { margin: 0; font-size: 17px; font-weight: 600; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .head { display: flex; align-items: center; gap: 10px; }
  .name { font-weight: 600; font-size: 17px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .status { font-size: 13px; color: var(--sub); }
  .status.bad { color: var(--warn); }
  .status.acc { color: var(--accent); }
  .big { font-size: 34px; font-weight: 600; letter-spacing: -0.5px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .stat { display: flex; flex-direction: column; min-width: 70px; }
  .stat b { font-size: 20px; font-weight: 600; }
  .stat span { font-size: 12px; color: var(--sub); }
  .toggle { width: 60px; height: 36px; border-radius: 18px; background: var(--off); position: relative; flex: none; transition: background .15s; cursor: pointer; }
  .toggle::after { content: ""; position: absolute; top: 4px; left: 4px; width: 28px; height: 28px; border-radius: 50%; background: #fff; transition: left .15s; }
  .toggle.on { background: var(--on); }
  .toggle.on::after { left: 28px; }
  .toggle.busy { opacity: .5; }
  .comp { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .comp:first-of-type { border-top: 0; }
  .comp .label { flex: 1; min-width: 120px; }
  .list .item { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .list .item:first-child { border-top: 0; }
  .item .t { flex: 1; min-width: 0; }
  .item .s { font-size: 13px; color: var(--sub); }
  .item .s.acc { color: var(--accent); }
  .sub { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .back { margin: 0 0 10px; }
  table.pts { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.pts td { padding: 5px 4px; border-top: 1px solid var(--line); }
  table.pts td:last-child { text-align: right; white-space: nowrap; }
  details summary { cursor: pointer; color: var(--sub); }
  #login { max-width: 320px; margin: 18vh auto; text-align: center; display: none; padding: 0 16px; }
  #login input { font: 28px/1 monospace; letter-spacing: 8px; text-align: center; width: 100%; padding: 12px; border-radius: 12px; border: 0; background: var(--card); margin: 16px 0; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--card2); padding: 10px 16px; border-radius: 12px; display: none; max-width: 90vw; z-index: 9; box-shadow: 0 4px 20px rgba(0,0,0,.3); }
  .empty { color: var(--sub); padding: 8px 2px; }
  pre.out { background: var(--card2); border-radius: 10px; padding: 10px; font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-all; max-height: 420px; overflow: auto; margin: 0; }
  .days { display: flex; gap: 4px; flex-wrap: wrap; }
  .days label { display: flex; flex-direction: column; align-items: center; font-size: 12px; color: var(--sub); }
  .muted { color: var(--sub); font-size: 14px; }
  code { background: var(--card2); padding: 1px 5px; border-radius: 6px; }
</style>
</head>
<body>
<div id="login">
  <h2>IoT Хаб</h2>
  <p class="pill">Введи PIN-код хаба (його показала команда встановлення, або виконай на Pi: <code>sudo iot-hub-pin</code>)</p>
  <input id="pin" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
  <button id="loginBtn" class="primary">Увійти</button>
  <p id="loginErr" class="status bad"></p>
</div>
<div id="app" style="display:none">
  <header>
    <h1 id="title">IoT Хаб</h1>
    <span class="pill" id="hubTemp" title="Температура процесора Raspberry Pi" style="display:none"></span>
    <span class="pill"><span id="conn" class="dot"></span><span id="connText">підключення…</span></span>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div id="view"></div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const qs = new URLSearchParams(location.search);
if (qs.has("kiosk")) document.documentElement.classList.add("kiosk");
let ws, devices = [], states = {}, dash = {}, rules = [], armed = [], rstatus = {}, admin = null, reqId = 1;
let view = { tab: "dev" };          // dev | rules | auto | set ; + detail / edit
let editing = false, draft = null, espCfg = null, espInfo = null, cloudList = null, scanList = null;
const busy = new Set(), pending = new Map();
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
function toast(t) { const e = $("toast"); e.textContent = t; e.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => e.style.display = "none", 4000); }
function fmtW(v) { if (v == null) return "—"; return Math.abs(v) >= 1000 ? (v / 1000).toFixed(2) + " кВт" : Math.round(v) + " Вт"; }
function fmt(v, unit, d = 1) { return v == null ? "—" : (typeof v === "number" ? (Number.isInteger(v) ? v : v.toFixed(d)) : v) + (unit ? " " + unit : ""); }
const hhmm = (m) => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
const fromHHMM = (s) => { const [h, m] = String(s || "0:0").split(":").map(Number); return (h || 0) * 60 + (m || 0); };
const DAYS = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Нд"];
const daysText = (d) => !d ? "один раз" : d === 127 ? "щодня" : d === 31 ? "Пн–Пт" : d === 96 ? "Сб–Нд" : DAYS.filter((_, i) => d & (1 << i)).join(", ");

// ------------------------------------------------------------------ зв'язок
function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => { setConn(true); setTimeout(pollHubTemp, 500); };
  ws.onclose = () => {
    setConn(false, "немає зв'язку");
    for (const p of pending.values()) p.reject(new Error("Зв'язок обірвався"));
    pending.clear();
    fetch("/ws").then((r) => { if (r.status === 401) showLogin(); else setTimeout(connect, 2000); }).catch(() => setTimeout(connect, 3000));
  };
  ws.onmessage = (e) => {
    if (e.data === "pong") return;
    const m = JSON.parse(e.data);
    if (m.t === "hello") { devices = m.devices || []; dash = m.dash || {}; $("title").textContent = m.name ? "IoT Хаб · " + m.name : "IoT Хаб"; if (!admin) loadAdmin(); softRender(); }
    else if (m.t === "snapshot") { states = m.states || {}; softRender(); }
    else if (m.t === "state") { states[m.key] = m.state; busy.delete(m.key); refreshLive(m.key); }
    else if (m.t === "rules") { rules = m.rules || []; armed = m.armed || []; rstatus = m.status || {}; if (view.tab === "rules" && !view.rule) softRender(); }
    else if (m.t === "rule_status") { rstatus[m.id] = m.status; armed = m.armed || armed; const el = document.getElementById("rs_" + m.id); if (el) el.textContent = ruleStatusText(rules.find((r) => r.id === m.id)); }
    else if (m.t === "ack") {
      const p = pending.get(m.id);
      if (p) { pending.delete(m.id); m.ok ? p.resolve(m) : p.reject(new Error(m.error || "Помилка")); }
      else if (!m.ok) toast(m.error || "Помилка");
    }
    else if (m.t === "notify") toast(`${m.title}: ${m.text}`);
    else if (m.t === "flash") flashProgress(m.text, m.pct);
    else if (m.t === "hub") {   // поза домом, через ретранслятор: чи на зв'язку сама Pi
      setConn(m.online, m.online ? null : "Raspberry Pi не на зв'язку");
      if (m.online) { ws.send(JSON.stringify({ t: "get" })); setTimeout(pollHubTemp, 500); }
    }
  };
}
function setConn(ok, text) { $("conn").className = ok ? "dot ok" : "dot"; $("connText").textContent = text || (ok ? "хаб на зв'язку" : "немає зв'язку"); }
setInterval(() => { if (ws && ws.readyState === 1) ws.send("ping"); }, 25000);
// температура Raspberry Pi в шапці (як vcgencmd measure_temp)
function showHubTemp(t) {
  const el = $("hubTemp");
  if (t == null) { el.style.display = "none"; return; }
  el.style.display = "";
  el.textContent = "🌡 " + Number(t).toFixed(1) + " °C";
  el.style.color = t >= 75 ? "var(--err, #f66)" : t >= 65 ? "var(--warn)" : "";
}
async function pollHubTemp() {
  if (ws && ws.readyState === 1 && $("connText").textContent === "хаб на зв'язку") {
    try { showHubTemp((await call("hub_temp", {}, 8000)).temp); } catch (e) { /* хаб старої версії або нема зв'язку */ }
  }
}
setInterval(pollHubTemp, 15000);
function send(m) { if (ws && ws.readyState === 1) { m.id = reqId++; ws.send(JSON.stringify(m)); return true; } toast("Немає зв'язку з хабом"); return false; }
function call(t, body = {}, timeoutMs = 30000) {
  return new Promise((resolve, reject) => {
    if (!ws || ws.readyState !== 1) return reject(new Error("Немає зв'язку з хабом"));
    const id = reqId++;
    pending.set(id, { resolve, reject });
    ws.send(JSON.stringify(Object.assign({ t, id }, body)));
    setTimeout(() => { if (pending.delete(id)) reject(new Error("Хаб не відповів")); }, timeoutMs);
  });
}
async function act(btn, fn, okText) {
  if (btn) btn.disabled = true;
  try { const r = await fn(); if (r && r.admin) admin = r.admin; if (okText) toast(okText); return r; }
  catch (e) { toast(e.message); }
  finally { if (btn) btn.disabled = false; }
}
async function loadAdmin() { try { admin = await call("admin_get"); softRender(); } catch (e) { /* повторимо пізніше */ } }
// не перемальовувати, поки людина щось вводить (інакше зітре введене)
function softRender() {
  const a = document.activeElement;
  if (a && $("view").contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && view.tab !== "dev") { softRender.later = true; return; }
  if (view.tab === "dev" && view.key && dev(view.key) && (dev(view.key).kind === "esp" || dev(view.key).kind === "tuya") && a && /^(INPUT|SELECT)$/.test(a.tagName)) { refreshLive(view.key); return; }
  render();
}
document.addEventListener("focusout", () => setTimeout(() => { if (softRender.later && !/^(INPUT|SELECT|TEXTAREA)$/.test((document.activeElement || {}).tagName || "")) { softRender.later = false; render(); } }, 300));

function showLogin() { $("app").style.display = "none"; $("login").style.display = "block"; $("pin").focus(); }
$("loginBtn").onclick = async () => {
  const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin: $("pin").value }) });
  if (r.ok) { $("login").style.display = "none"; $("app").style.display = "block"; connect(); }
  else $("loginErr").textContent = (await r.json().catch(() => ({}))).error || "Помилка";
};
$("pin").addEventListener("keydown", (e) => { if (e.key === "Enter") $("loginBtn").click(); });

// ------------------------------------------------------------------ дані пристроїв
const realDevices = () => devices.filter((d) => d.kind !== "hub");
const dev = (key) => devices.find((x) => x.key === key);
const nameOf = (key) => (dev(key) || {}).name || (key ? "?" : "—");
function tuyaVals(st) { const v = (st && st.vals) || {}; return { on: v.on === true, power: v.power ?? null, voltage: v.voltage ?? null, current: v.current ?? null }; }
function invSummary(pts) {
  const m = {}; for (const p of pts) m[String(p.title).toLowerCase().replace(/\s+/g, " ").trim()] = p;
  const n = (...ks) => { for (const k of ks) if (m[k] && !isNaN(parseFloat(m[k].val))) return parseFloat(m[k].val); return null; };
  const w = (...ks) => { for (const k of ks) if (m[k] && !isNaN(parseFloat(m[k].val))) return parseFloat(m[k].val) * (String(m[k].unit).toLowerCase() === "kw" ? 1000 : 1); return null; };
  let pv = w("pv total power", "pv power", "total pv power", "pv input power", "solar power", "dc output power");
  if (pv == null) { const parts = Object.keys(m).filter((k) => /^pv\d (input |charging |charger )?power$/.test(k)).map((k) => w(k)).filter((x) => x != null); pv = parts.length ? parts.reduce((a, b) => a + b, 0) : null; }
  const gridV = n("ac input voltage", "grid voltage", "mains voltage");
  const bv = n("battery voltage", "bms battery voltage"), chg = n("battery charging current", "pv charging current"), dis = n("battery discharge current");
  let batt = w("battery power"); if (batt == null && bv != null && (chg != null || dis != null)) batt = bv * ((chg || 0) - (dis || 0));
  const modeRaw = ["working state", "operating mode", "work state", "work mode", "mode"].map((k) => m[k] && m[k].val).find((v) => v);
  const ml = String(modeRaw || "").toLowerCase();
  const mode = !modeRaw ? null : /line|grid|bypass/.test(ml) ? "Від мережі" : /battery/.test(ml) ? "Від батареї" : /standby/.test(ml) ? "Очікування" : /fault/.test(ml) ? "Аварія" : /charg/.test(ml) ? "Заряд" : modeRaw;
  return { pv, soc: n("battery capacity", "soc", "state of charge", "battery soc", "bms soc"),
    load: w("output active power", "ac output active power", "active power", "load power", "load active power"),
    loadPct: n("ac output load", "load percent", "output load percent", "load percentage", "output load"),
    bv, batt, gridV, grid: gridV == null ? null : gridV > 100, mode };
}
const comps = (key) => ((states[key] || {}).state || {}).comps || [];
const FX = [["none", "Свій колір"], ["breathe", "Дихання"], ["wipe", "Wipe"], ["confetti", "Confetti"], ["sinelon", "Sinelon"], ["juggle", "Juggle"], ["juggle2", "Juggle 2"],
  ["plasma", "Plasma"], ["rainbow", "Rainbow"], ["glitter", "Rainbow Glitter"], ["snow", "Snow"], ["matrix", "Matrix Rain"], ["running", "Running Lights"], ["lava", "Lava"],
  ["ocean", "Ocean"], ["aurora", "Aurora"], ["pacifica", "Pacifica"], ["theater", "Theater Chase"], ["theater_rainbow", "Theater Rainbow"], ["pride", "Pride"]];
const fxName = (id) => (FX.find((f) => f[0] === id) || [id, id])[1];
const hex2rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const rgb2hex = (c) => "#" + (c || [255, 255, 255]).map((v) => Number(v).toString(16).padStart(2, "0")).join("");
const OUT_TYPES = ["relay", "pwm", "ws2812", "tuya"], TEMP_TYPES = ["dht", "ds18b20", "aht", "bme", "sht21", "thermo"];

// показники для умов правил (як у додатку)
function metricsOf(key) {
  const d = dev(key); if (!d) return [];
  if (d.kind === "inv") {
    const base = [["grid", "Мережа є", "", "B"], ["mode", "Режим", "", "T"], ["soc", "Заряд батареї", "%", "N"], ["pv", "Сонце", "Вт", "N"],
      ["load", "Навантаження", "Вт", "N"], ["loadPct", "Навантаження", "%", "N"], ["gridV", "Напруга мережі", "В", "N"],
      ["batt", "Батарея (+заряд/−розряд)", "Вт", "N"], ["bv", "Напруга батареї", "В", "N"]];
    const pts = ((states[key] || {}).points || []).map((p) => ["pt:" + p.title, p.title, p.unit || "", isNaN(parseFloat(p.val)) ? "T" : "N"]);
    return base.concat(pts);
  }
  if (d.kind === "hub") return [["temp", "Температура процесора", "°C", "N"]];
  if (d.kind === "tuya") return [["on", "Увімкнено", "", "B"], ["power", "Потужність", "Вт", "N"], ["current", "Струм", "А", "N"], ["voltage", "Напруга", "В", "N"], ["online", "На зв'язку", "", "B"]];
  const out = [["online", "На зв'язку", "", "B"]];
  for (const c of comps(key)) {
    const p = "c" + c.i;
    if (OUT_TYPES.includes(c.t)) out.push([p + ":on", c.name + ": увімкнено", "", "B"]);
    if (["dht", "aht", "bme", "ds18b20", "sht21", "thermo"].includes(c.t)) out.push([p + ":temp", c.name + ": температура", "°C", "N"]);
    if (["dht", "aht", "bme", "sht21"].includes(c.t)) out.push([p + ":hum", c.name + ": вологість", "%", "N"]);
    if (c.t === "bme") out.push([p + ":pres", c.name + ": тиск", "гПа", "N"]);
    if (c.t === "analog") out.push([p + ":pct", c.name, "%", "N"]);
    if (c.t === "input" || c.t === "button") out.push([p + ":active", c.name + ": активний", "", "B"]);
  }
  return out;
}
function valueOf(key, metric) {
  const d = dev(key), st = states[key];
  if (!d) return null;
  if (d.kind === "hub") return admin && admin.hub ? admin.hub.cpuTemp : null;
  if (!st) return null;
  if (metric === "online") return !!st.online;
  if (!st.online) return null;
  if (d.kind === "inv") {
    if (metric.startsWith("pt:")) { const p = (st.points || []).find((x) => x.title === metric.slice(3)); return p ? (isNaN(parseFloat(p.val)) ? p.val : parseFloat(p.val)) : null; }
    return invSummary(st.points || [])[metric] ?? null;
  }
  if (d.kind === "tuya") return (st.vals || {})[metric] ?? null;
  const [ci, f] = metric.slice(1).split(":"); const c = comps(key).find((x) => x.i === Number(ci));
  return c ? (c[f] ?? null) : null;
}
const fmtVal = (v, unit) => v == null ? "немає даних" : typeof v === "boolean" ? (v ? "так" : "ні") : fmt(v, unit, 2);

// ------------------------------------------------------------------ розмітка
const TABS = [["dev", "Пристрої"], ["rules", "Правила"], ["auto", "Термостати й розклади"], ["set", "Налаштування"]];
function go(tab, extra = {}) { view = Object.assign({ tab }, extra); espCfg = null; espInfo = null; if (!extra.keepDraft) draft = null; render(); window.scrollTo(0, 0); }
function render() {
  $("tabs").innerHTML = TABS.map(([k, l]) => `<button class="${view.tab === k ? "sel" : ""}" onclick="go('${k}')">${l}</button>`).join("");
  const v = $("view");
  if (view.tab === "dev") v.innerHTML = view.key ? deviceView(view.key) : gridView();
  else if (view.tab === "rules") v.innerHTML = view.rule ? ruleEditor() : rulesView();
  else if (view.tab === "auto") v.innerHTML = autoView();
  else v.innerHTML = settingsView();

// розклади, що живуть на самих платах ESP (поле plan у компонентах)
let boardCfg = null, boardLoading = false;
async function loadBoards() {
  if (boardLoading) return; boardLoading = true;
  const out = {};
  for (const d of realDevices().filter((x) => x.kind === "esp")) {
    try { const r = await call("esp_config_get", { key: d.key }, 15000); out[d.key] = { cfg: r.config, info: r.info }; }
    catch (e) { out[d.key] = { error: e.message }; }
  }
  boardCfg = out; boardLoading = false;
  if (view.tab === "auto") softRender();
}
function boardPlans() {
  const list = [];
  for (const [key, b] of Object.entries(boardCfg || {})) {
    (b.cfg && b.cfg.comps || []).forEach((c, ci) => (c.plan || []).forEach((p, pi) => list.push({ id: `b:${key}:${ci}:${pi}`, board: true, deviceKey: key, comp: ci, compName: c.name,
      hour: Math.floor(p.t / 60), minute: p.t % 60, days: p.d, turnOn: !!p.on, enabled: true, clock: b.info && b.info.clock })));
  }
  return list;
}
async function saveBoardPlan(key, comp, entry, removeId) {
  const r = await call("esp_config_get", { key }, 15000), cfg = r.config;
  if (removeId) { const [, , ci, pi] = removeId.split(":"); const c = cfg.comps[Number(ci)]; if (c && c.plan) c.plan.splice(Number(pi), 1); }
  if (entry) { const c = cfg.comps[comp]; if (!c) throw new Error("Немає такого виходу на платі"); c.plan = (c.plan || []).concat([entry]); }
  await call("esp_config_set", { key, config: cfg }, 20000);
  // перевірити, що плата справді прийняла розклад
  const want = JSON.stringify(cfg.comps.map((c) => c.plan || []));
  const back = await call("esp_config_get", { key }, 15000);
  if (JSON.stringify((back.config.comps || []).map((c) => c.plan || [])) !== want) throw new Error("Плата не зберегла розклад — спробуй ще раз або онови прошивку плати");
}

async function moveToBoard(id, btn) {

  const outs = comps(s.deviceKey).filter((c) => OUT_TYPES.includes(c.t));

  if (comp < 0) return toast("На платі немає виходів");
  const ok = await act(btn, async () => { await saveBoardPlan(s.deviceKey, comp, { d: s.days, t: s.hour * 60 + s.minute, on: !!s.turnOn });
    return call("sched_set", { schedules: (admin.schedules || []).filter((x) => x.id !== id) }); }, "Перенесено на плату");

}
async function saveSched(btn, del) {
  const id = $("scForm").dataset.id, list = (admin.schedules || []).filter((x) => x.id !== id);
  const devKey = $("scDev").value, isEsp = (dev(devKey) || {}).kind === "esp";
  if (id.startsWith("b:") || (isEsp && !del)) {
    // розклад плати: зберігається на самій платі
    const m = fromHHMM($("scTime").value); let days = 0; document.querySelectorAll(".scDay").forEach((c) => { if (c.checked) days |= 1 << Number(c.dataset.b); });
    if (!del && !days) return toast("Для розкладу на платі вибери хоча б один день");
    const outs = comps(devKey).filter((c) => OUT_TYPES.includes(c.t));
    let comp = $("scComp") ? Number($("scComp").value) : -1; if (comp < 0 && outs.length) comp = outs[0].i;
    const ok = await act(btn, async () => {
      const oldKey = id.startsWith("b:") ? id.split(":")[1] : null;
      if (oldKey && (del || oldKey !== devKey)) await saveBoardPlan(oldKey, -1, null, id);
      if (!del) await saveBoardPlan(devKey, comp, { d: days, t: m, on: $("scOn").value === "1" }, oldKey === devKey ? id : null);
      if (!id.startsWith("b:") && (admin.schedules || []).some((x) => x.id === id)) return call("sched_set", { schedules: list });
      return {};
    }, del ? "Видалено" : "Збережено на платі");
    if (ok) { boardCfg = null; go("auto"); }
    return;
  }
  if (!del) {
    const m = fromHHMM($("scTime").value); let days = 0; document.querySelectorAll(".scDay").forEach((c) => { if (c.checked) days |= 1 << Number(c.dataset.b); });
    const s = { id, deviceKey: $("scDev").value, hour: Math.floor(m / 60), minute: m % 60, days, turnOn: $("scOn").value === "1", enabled: $("scEn").checked, comp: $("scComp") ? Number($("scComp").value) : -1 };
    if (!s.deviceKey) return toast("Вибери пристрій");
    list.push(s);
  }
  if (await act(btn, () => call("sched_set", { schedules: list }), del ? "Видалено" : "Збережено")) go("auto");
}

      <div class="muted">Сповіщення від правил показуються тут, у панелі.</div></div>

    <div class="card"><h3>Оновлення хаба</h3>
      <div class="muted">Pi сама завантажить нову версію з GitHub і перевстановиться (налаштування зберігаються). Панель на хвилину втратить зв'язок і підключиться знову.</div>
      <div class="row"><button onclick="updCheck(this)">Перевірити оновлення</button>${upd && !upd.upToDate ? `<button class="primary" onclick="updRun(this)">Оновити хаб</button>` : ""}<button class="ghost" onclick="updLog(this)">Журнал оновлення</button></div>
      ${upd ? `<div class="muted">Встановлено: <code>${esc((upd.installed.sha || "?").slice(0, 7))}</code> (${esc(upd.installed.branch || "?")}${upd.installed.at ? ", " + esc(upd.installed.at.slice(0, 16).replace("T", " ")) : ""}) · остання: <code>${esc(upd.latest.slice(0, 7))}</code>${upd.latestDate ? " від " + esc(upd.latestDate.slice(0, 16).replace("T", " ")) : ""} — ${upd.upToDate ? "<b>актуально</b>" : "<b>є оновлення</b>"}</div>
        ${upd.changes && upd.changes.length ? `<details open><summary>Що нового (${upd.changes.length})</summary><ul style="margin:6px 0;padding-left:20px">${upd.changes.slice().reverse().map((c) => `<li>${esc(c)}</li>`).join("")}</ul></details>` : ""}` : ""}
      ${updText != null ? `<pre class="out" id="updOut">${esc(updText)}</pre>` : ""}</div>

    <div class="card"><h3>Консоль Raspberry Pi</h3>
      <div class="muted">Команди виконуються на Pi від користувача хаба${conRoot ? "" : " (без прав root)"}. Кожна команда записується в журнал хаба. ${conRoot ? "<b>Root дозволено</b> — вимкнути на Pi: <code>sudo iot-hub-console-root off</code>" : "Root (sudo) вмикається лише на самій Pi: <code>sudo iot-hub-console-root on</code>"}</div>
      <div class="row" style="gap:6px">${[["Температура", "vcgencmd measure_temp"], ["Аптайм", "uptime"], ["Диск", "df -h /"], ["Пам'ять", "free -h"], ["Журнал хаба", "journalctl -u iot-hub -n 40 --no-pager"], ["Wi-Fi плат (MQTT)", "ss -tn state established '( sport = :1883 )'"], ["IP", "hostname -I"], ["Ключі плат ESP", "python3 -c \"import json;[print(d.get('name'),'|',d.get('ip'),'|',d.get('apiKey')) for d in json.load(open('/etc/iot-hub/config.json'))['devices'] if d.get('kind')=='ESP']\""]].map(([l, c]) => `<button class="small" onclick="$('conCmd').value=${esc(JSON.stringify(c))};conRun()">${l}</button>`).join("")}</div>
      <div class="row"><input id="conCmd" style="flex:1;min-width:200px;font-family:ui-monospace,monospace" placeholder="напр.: ls -la /opt/iot-hub" onkeydown="if(event.key==='Enter')conRun()">
        <label class="c"><input type="checkbox" id="conRootCb" ${conRoot ? "" : "disabled"}> root</label><button class="primary" id="conBtn" onclick="conRun()">Виконати</button></div>
      ${conOut != null ? `<pre class="out" id="conOut">${esc(conOut)}</pre>` : ""}</div></div>`;
}
// ---------------- прошивка через USB
let usbPortList = null;
function flashProgress(text, pct) {
  const el = $("flProg"); if (!el) return toast(text);
  el.innerHTML = esc(text) + (pct != null ? `<div style="height:8px;background:var(--card2);border-radius:4px;margin-top:6px"><div style="height:8px;width:${pct}%;background:var(--accent);border-radius:4px"></div></div>` : "");
}
async function usbPorts(btn) { const r = await act(btn, () => call("usb_ports")); if (r) { usbPortList = r.ports; render(); } }
async function usbFlash(btn) {
  const port = $("flPort").value, erase = $("flErase").checked;
  if (!confirm(`Прошити плату на ${port}?${erase ? " Усе на ній буде стерто." : ""}`)) return;
  const r = await act(btn, () => call("usb_flash", { port, erase }, 600000));
  if (r) flashProgress(`Готово: прошивка для ${r.board} записана. Плата піднімає точку доступу «IoT-…» для налаштування Wi-Fi.`, 100);
}
const CHIP_BOARD = { "ESP32-C3": "esp32c3", "ESP32-S3": "esp32s3", "ESP32-S2": "esp32s2", "ESP32": "esp32", "ESP8266": "esp8266" };
async function fetchFw(board) {
  let off = 0, size = 1, parts = [];
  while (off < size) {
    const r = await call("fw_get", { board, off }, 120000);
    size = r.size; const bin = atob(r.data); parts.push(bin); off += bin.length;
    flashProgress(`Завантажую прошивку з Pi… ${Math.round(off / size * 100)}%`, Math.round(off / size * 20));
    if (!bin.length) break;
  }
  return parts.join("");
}
async function webFlash(btn) {
  const erase = $("flErase").checked;
  let transport;
  btn.disabled = true;
  try {
    const { ESPLoader, Transport } = await import("https://unpkg.com/esptool-js@0.5.4/bundle.js");
    const port = await navigator.serial.requestPort();
    transport = new Transport(port, true);
    const loader = new ESPLoader({ transport, baudrate: 460800, romBaudrate: 115200, terminal: { clean() {}, writeLine() {}, write() {} } });
    flashProgress("Підключаюсь до плати… (якщо довго — затисни BOOT і натисни RESET)");
    await loader.main();
    const chip = loader.chip.CHIP_NAME;
    let board = CHIP_BOARD[chip];
    if (!board) throw new Error("Непідтримувана плата: " + chip);
    if (board === "esp8266" && (await loader.getFlashSize()) <= 1024) board = "esp01";
    if (!confirm(`Знайдено ${chip}. Прошити?${erase ? " Усе на платі буде стерто." : ""}`)) return;
    const bin = await fetchFw(board);
    flashProgress(erase ? "Стираю плату…" : "Прошиваю…", 20);
    await loader.writeFlash({ fileArray: [{ data: bin, address: 0 }], flashSize: "keep", flashMode: "keep", flashFreq: "keep", eraseAll: erase, compress: true,
      reportProgress: (i, w, t) => flashProgress(`Прошиваю… ${Math.round(w / t * 100)}%`, 20 + Math.round(w / t * 80)) });
    await loader.after("hard_reset");
    flashProgress(`Готово: прошивка для ${board} записана. Плата піднімає точку доступу «IoT-…» для налаштування Wi-Fi.`, 100);
  } catch (e) {
    if (e && e.name !== "NotFoundError") flashProgress("Помилка: " + (e.message || e));
  } finally {
    btn.disabled = false;
    try { if (transport) await transport.disconnect(); } catch (e) { /* ок */ }
  }
}

// ---------------- оновлення хаба
let upd = null, updText = null, updTimer = null;
async function updCheck(btn) { const r = await act(btn, () => call("hub_update_check", {}, 30000)); if (r) { upd = r; render(); } }
async function updRun(btn) {
  if (!confirm("Оновити хаб до " + upd.latest.slice(0, 7) + "? Панель на хвилину втратить зв'язок.")) return;
  if (await act(btn, () => call("hub_update", { sha: upd.latest }), "Оновлення запущено")) { updText = "Оновлення запущено…"; render(); updPoll(); }
}
async function updLog(btn) { const r = await act(btn, () => call("hub_update_log")); if (r) { updText = r.log || "(журнал порожній)"; render(); } }
function updPoll() {
  clearTimeout(updTimer);
  updTimer = setTimeout(async () => {
    try {
      const r = await call("hub_update_log", {}, 8000); updText = r.log;
      const el = $("updOut"); if (el) { el.textContent = updText; el.scrollTop = el.scrollHeight; }
      if (/Код завершення: \d+/.test(updText)) { upd = null; loadAdmin(); toast(/Код завершення: 0/.test(updText) ? "Хаб оновлено" : "Оновлення завершилось з помилкою — див. журнал"); return; }
    } catch (e) { /* хаб перезапускається — чекаємо */ }
    updPoll();
  }, 3000);
}

// ---------------- консоль
let conOut = null, conRoot = false, conHist = [];
async function conInfo() { try { const r = await call("console_info"); if (r.rootAllowed !== conRoot) { conRoot = r.rootAllowed; if (view.tab === "set") softRender(); } } catch (e) { /* ок */ } }
async function conRun() {
  const cmd = $("conCmd").value.trim(); if (!cmd) return;
  const root = $("conRootCb") && $("conRootCb").checked;
  if (/\b(reboot|shutdown|poweroff|rm\s+-rf)\b/.test(cmd) && !confirm("Виконати «" + cmd + "»?")) return;
  const btn = $("conBtn"); btn.disabled = true; btn.textContent = "Виконую…";
  try {
    const r = await call("console", { cmd, root }, 75000);
    conRoot = r.rootAllowed;
    conOut = `$ ${cmd}\n${r.out}${r.code ? "\n[код " + r.code + "]" : ""}`;
  } catch (e) { conOut = `$ ${cmd}\n${e.message}`; }
  conHist.push(cmd);
  render();
  const inp = $("conCmd"); if (inp) { inp.value = ""; inp.focus(); }
  const o = $("conOut"); if (o) o.scrollTop = o.scrollHeight;
}

async function moveDev(i, dir) { const keys = admin.devices.map((d) => d.key), j = i + dir; if (j < 0 || j >= keys.length) return; [keys[i], keys[j]] = [keys[j], keys[i]]; if (await act(null, () => call("device_move", { keys }))) render(); }
async function scanEsp(btn) { btn.textContent = "Шукаю…"; const r = await act(btn, () => call("esp_scan", {}, 20000)); scanList = r ? r.found : scanList; render(); }
async function addEsp(btn) {
  const r = await act(btn, () => call("esp_add", { ip: $("espIp").value.trim(), name: $("espName").value.trim(), apiKey: $("espKey").value.trim() }, 30000), "Плату додано");
  if (r) { scanList = null; go("dev", { key: r.key }); }
}
async function cloudListDo(btn) { const r = await act(btn, () => call("tuya_cloud_list", { region: $("tcReg").value, accessId: $("tcId").value, secret: $("tcSecret").value }, 60000)); if (r) { cloudList = r.cloud; render(); } }
async function cloudAdd(btn) {
  const ids = [...document.querySelectorAll(".cloudPick:checked")].map((c) => c.value);
  if (!ids.length) return toast("Вибери пристрої");
  const r = await act(btn, () => call("tuya_cloud_add", { ids }, 30000), "Додано — Pi сама знайде розетки в мережі");
  if (r) { cloudList = null; render(); }
}
async function addTuyaManual(btn) {
  const device = { kind: "TUYA", name: $("mName").value, deviceId: $("mId").value.trim(), localKey: $("mKey").value.trim(), ip: $("mIp").value.trim(), version: $("mVer").value };
  if (await act(btn, () => call("device_save", { device }), "Розетку додано")) render();
}
async function essLogin(btn) {
  const r = await act(btn, () => call("inv_login", { server: $("essSrv").value, user: $("essUser").value, password: $("essPwd").value }, 60000));
  if (r) { toast(`Знайдено інверторів: ${r.found}`); render(); }
}
async function essLogout(btn) { if (confirm("Відключити акаунт SmartESS від Pi?") && await act(btn, () => call("inv_logout"))) render(); }

setInterval(() => { if (view.tab === "dev" && !view.key) realDevices().forEach((d) => renderCard(d.key)); }, 60000);
setInterval(() => { if (ws && ws.readyState === 1 && view.tab === "set") loadAdmin(); }, 60000);
$("app").style.display = "block";
render();
connect();
</script>
