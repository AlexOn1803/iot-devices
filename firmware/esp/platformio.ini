; Універсальна прошивка IoT Devices: ESP8266 / ESP32 / S2 / S3 / C3.
; Збірка всіх плат: pio run   |  однієї: pio run -e esp32c3   |  по USB: pio run -e esp32c3 -t upload

[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -DFW_VERSION=\"${sysenv.FW_VERSION}\"
lib_deps =
    bblanchon/ArduinoJson@^7.2.1
    adafruit/Adafruit NeoPixel@^1.12.3
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit AHTX0@^2.0.5
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit BMP280 Library@^2.6.8
    adafruit/Adafruit BusIO@^1.16.1
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    knolleary/PubSubClient@^2.8

[esp32_base]
platform = espressif32@6.9.0
board_build.partitions = default.csv

[env:esp32c3]
extends = esp32_base
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DFW_BOARD=\"esp32c3\" -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32]
extends = esp32_base
board = esp32dev
build_flags = ${env.build_flags} -DFW_BOARD=\"esp32\"

[env:esp32s3]
extends = esp32_base
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DFW_BOARD=\"esp32s3\" -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s2]
extends = esp32_base
board = lolin_s2_mini
build_flags = ${env.build_flags} -DFW_BOARD=\"esp32s2\" -DARDUINO_USB_CDC_ON_BOOT=1

; Wemos D1 mini, NodeMCU та інші ESP8266 з 4 МБ флешу
[env:esp8266]
platform = espressif8266@4.2.1
board = d1_mini
board_build.ldscript = eagle.flash.4m1m.ld
build_flags = ${env.build_flags} -DFW_BOARD=\"esp8266\"

; ESP-01 / ESP-01S (1 МБ флешу)
[env:esp01]
platform = espressif8266@4.2.1
board = esp01_1m
board_build.ldscript = eagle.flash.1m64.ld
build_flags = ${env.build_flags} -DFW_BOARD=\"esp01\" -Os
