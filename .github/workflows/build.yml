name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > release.keystore; fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk iot-devices.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: iot-devices.apk

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [esp32c3, esp32, esp32s3, esp32s2, esp8266, esp01]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ matrix.board }}-${{ hashFiles('firmware/esp/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio esptool

      - name: Build firmware
        working-directory: firmware/esp
        env:
          FW_VERSION: 1.0.${{ github.run_number }}
        run: pio run -e ${{ matrix.board }}

      - name: Make flashable images
        working-directory: firmware/esp
        run: |
          set -e
          b=${{ matrix.board }}
          B=.pio/build/$b
          out=../../fw-$b
          mkdir -p $out
          case $b in
            esp8266|esp01)
              # для ESP8266 firmware.bin уже містить завантажувач і пишеться з адреси 0x0
              cp $B/firmware.bin $out/iot-$b-full.bin ;;
            *)
              chip=$b; boot=0x1000
              case $b in esp32c3|esp32s3) boot=0x0 ;; esac
              BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -1)
              python -m esptool --chip $chip merge_bin -o $out/iot-$b-full.bin \
                $boot $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 "$BOOT_APP0" 0x10000 $B/firmware.bin ;;
          esac
          if [ $b = esp01 ]; then
            # на 1 МБ флешу оновлення вміщується лише стиснутим — ядро ESP8266 розпаковує .gz саме
            gzip -9 -n -c $B/firmware.bin > $out/iot-$b-ota.bin
          else
            cp $B/firmware.bin $out/iot-$b-ota.bin
          fi
          # старі назви для плат, прошитих версією 1.0.5
          if [ $b = esp32c3 ]; then cp $out/iot-$b-full.bin $out/esp32c3-full.bin; cp $out/iot-$b-ota.bin $out/esp32c3-ota.bin; fi
          ls -la $out

      - uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.board }}
          path: fw-${{ matrix.board }}/*.bin

      # для розшифрування аварійних журналів (addr2line); у реліз не потрапляє
      - uses: actions/upload-artifact@v4
        with:
          name: elf-${{ matrix.board }}
          path: firmware/esp/.pio/build/${{ matrix.board }}/firmware.elf
          retention-days: 30

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [app, firmware]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: "{apk,fw-*}"
          merge-multiple: true

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo '{"fw":"1.0.${{ github.run_number }}","app":"1.0.${{ github.run_number }}","boards":["esp32c3","esp32","esp32s3","esp32s2","esp8266","esp01"]}' > out/version.json
          ls -la out
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/*.apk out/*.bin out/version.json \
            --title "IoT Devices (збірка ${{ github.run_number }})" \
            --latest \
            --notes "Автоматична збірка з коміту ${{ github.sha }}.

          - **iot-devices.apk** — додаток для Android.
          - **iot-<плата>-full.bin** — прошивка для першого запису по USB з адреси 0x0 (додаток прошиває сам через USB-OTG).
          - **iot-<плата>-ota.bin** — для оновлення по Wi-Fi.
          - Плати: esp32c3, esp32, esp32s3, esp32s2, esp8266 (Wemos D1 mini, NodeMCU), esp01 (ESP-01/01S)."
