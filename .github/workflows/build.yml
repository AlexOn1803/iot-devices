name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > release.keystore; fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk iot-devices.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: iot-devices.apk

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ hashFiles('firmware/esp32c3/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio esptool

      - name: Build ESP32-C3 firmware
        working-directory: firmware/esp32c3
        env:
          FW_VERSION: 1.0.${{ github.run_number }}
        run: pio run -e esp32c3

      - name: Merge into single flashable image
        working-directory: firmware/esp32c3
        run: |
          B=.pio/build/esp32c3
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -1)
          python -m esptool --chip esp32c3 merge_bin -o ../../esp32c3-full.bin \
            0x0 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 "$BOOT_APP0" 0x10000 $B/firmware.bin
          cp $B/firmware.bin ../../esp32c3-ota.bin

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            esp32c3-full.bin
            esp32c3-ota.bin

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [app, firmware]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/iot-devices.apk out/esp32c3-full.bin out/esp32c3-ota.bin \
            --title "IoT Devices (збірка ${{ github.run_number }})" \
            --latest \
            --notes "Автоматична збірка з коміту ${{ github.sha }}.

          - **iot-devices.apk** — додаток для Android.
          - **esp32c3-full.bin** — прошивка ESP32-C3 для першого запису по USB (адреса 0x0).
          - **esp32c3-ota.bin** — та сама прошивка для оновлення по Wi-Fi."
